name: Release

# Two ways to release:
#   1. Push a tag:  git tag v0.1.0 && git push origin v0.1.0
#   2. Actions -> Release -> Run workflow (on main), pick patch / minor / major.
# Either builds a signed APK and publishes it as a GitHub release, which the private app store reads.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increase"
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: "Optional: what changed"
        required: false

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IFS=. read -r MA MI PA <<<"$VERSION"
            CODE=$((MA * 1000000 + MI * 1000 + PA))
          else
            read -r VERSION CODE <<<"$(scripts/next-version.sh "$BUMP")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (versionCode $CODE)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed APK
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "Signing with the repository secrets"
          else
            echo "::warning::No signing secrets set: using the committed experimental key (see README)."
          fi
          ./gradlew --no-daemon assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.code }}"
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/contacts-${{ steps.version.outputs.version }}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ inputs.notes || 'Experimental build. Set it as the default phone app to answer calls; test on a spare phone first.' }}
          generate_release_notes: false
          files: dist/*.apk
          fail_on_unmatched_files: true
